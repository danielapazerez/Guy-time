<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f7a9c2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Guy Time">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Guy Time</title>
</head>
<body>
  <div id="splash" class="splash">
    <img src="icons/icon-192.png" alt="Guy Time">
    <h1>Guy Time</h1>
    <p>כל האכלה נחשבת 💗</p>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt=""><span>Guy Time</span></div>
      <button id="installBtn" class="icon-btn hidden" aria-label="התקנה">↗︎</button>
    </header>

    <section id="home" class="page active">
      <article class="hero-card">
        <p class="eyebrow">עברו</p>
        <div id="sinceLast" class="since">--:--:--</div>
        <p class="sub">מאז ההאכלה האחרונה</p>
      </article>

      <div class="dual-control" role="group" aria-label="מצב שאיבה דו צדדית">
        <span>שאיבה דו״צ</span>
        <button id="dualToggle" class="switch" type="button" role="switch" aria-checked="false"><span></span></button>
      </div>

      <section class="feeding-grid">
        <button class="feed-btn left" data-side="left">
          <span class="feed-icon">🤱</span><strong>שמאל</strong><small>לחיצה להתחלה</small>
        </button>
        <button class="feed-btn right" data-side="right">
          <span class="feed-icon">🤱</span><strong>ימין</strong><small>לחיצה להתחלה</small>
        </button>
      </section>
      <div id="activeTimer" class="active-timer hidden"></div>

      <section class="quick-grid">
        <button id="bottleBtn" class="quick-card blue"><span>🍼</span><strong>בקבוק</strong></button>
        <button id="vitaminBtn" class="quick-card yellow"><span>☀️</span><strong>ויטמין D</strong><small id="vitaminState">טרם ניתן היום</small></button>
      </section>

      <section class="summary-card">
        <div><strong id="todayFeeds">0</strong><span>האכלות היום</span></div>
        <div><strong id="todayMinutes">0</strong><span>דקות הנקה</span></div>
        <div><strong id="todayMl">0</strong><span>מ״ל בבקבוקים</span></div>
      </section>
    </section>

    <section id="history" class="page">
      <div class="page-title"><h2>היסטוריה</h2><button id="clearAll" class="text-danger">מחיקת הכול</button></div>
      <div id="historyList" class="history-list"></div>
    </section>

    <section id="stats" class="page">
      <div class="page-title"><h2>סטטיסטיקה</h2></div>
      <div class="range-tabs">
        <button class="range active" data-days="7">7 ימים</button>
        <button class="range" data-days="30">30 ימים</button>
        <button class="range" data-days="0">הכול</button>
      </div>
      <section class="stats-grid">
        <div class="stat pink"><strong id="statNursing">0</strong><span>הנקות</span></div>
        <div class="stat green"><strong id="statMinutes">0</strong><span>דקות</span></div>
        <div class="stat blue"><strong id="statBottles">0</strong><span>בקבוקים</span></div>
        <div class="stat lavender"><strong id="statMl">0</strong><span>מ״ל</span></div>
      </section>
      <article class="chart-card"><h3>האכלות לפי יום</h3><canvas id="feedsChart" width="700" height="300"></canvas></article>
      <article class="chart-card"><h3>ימין מול שמאל</h3><canvas id="sidesChart" width="700" height="260"></canvas></article>
    </section>

    <nav class="tabbar">
      <button class="tab active" data-page="home"><span>⌂</span><small>בית</small></button>
      <button class="tab" data-page="history"><span>☷</span><small>היסטוריה</small></button>
      <button class="tab" data-page="stats"><span>◔</span><small>סטטיסטיקה</small></button>
    </nav>
  </main>

  <dialog id="bottleDialog" class="sheet">
    <form method="dialog" id="bottleForm">
      <div class="sheet-head"><button value="cancel">ביטול</button><h2>בקבוק</h2><span></span></div>
      <label>סוג חלב</label>
      <div class="segmented">
        <input type="radio" name="milk" id="pumped" value="חלב אם שאוב" checked><label for="pumped">חלב אם שאוב</label>
        <input type="radio" name="milk" id="formula" value="תמ״ל"><label for="formula">תמ״ל</label>
      </div>
      <label for="amount">כמות במ״ל</label>
      <div class="amount-row"><button type="button" id="minus">−</button><input id="amount" type="number" min="0" max="500" step="5" value="90"><button type="button" id="plus">+</button></div>
      <div class="presets"><button type="button" data-ml="60">60</button><button type="button" data-ml="90">90</button><button type="button" data-ml="120">120</button><button type="button" data-ml="150">150</button></div>
      <button id="saveBottle" class="primary" value="default">שמירה ✓</button>
    </form>
  </dialog>

  <dialog id="editDialog" class="sheet">
    <form method="dialog" id="editForm">
      <div class="sheet-head"><button value="cancel">ביטול</button><h2>עריכת אירוע</h2><span></span></div>
      <input type="hidden" id="editId">
      <label for="editDate">תאריך ושעה</label><input id="editDate" type="datetime-local">
      <div id="editDynamic"></div>
      <button class="primary" value="default">שמירה</button>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
